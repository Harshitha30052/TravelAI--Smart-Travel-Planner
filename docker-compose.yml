version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: travelai-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  ml-service:
    build:
      context: .
      dockerfile: Dockerfile.ml
    container_name: travelai-ml
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: travelai-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/travelai
      - JWT_SECRET=travel_ai_super_secret_jwt_key_2026
      - ML_API_URL=http://ml-service:8000
    depends_on:
      - mongodb
      - ml-service

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: travelai-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo-data:
